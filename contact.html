<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — IvanAyao</title>
  <link rel="icon" href="assets/logo.png">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div class="curtain"><img src="assets/logo.png" alt=""></div>

  <div class="page" id="page">
    <main>
      <section class="c-layout">
        <aside><div class="c-side" data-contact-info data-reveal></div></aside>

        <div class="c-main">
          <h1 class="display" data-split="chars">LET’S TALK</h1>
          <p class="intro" data-reveal>Tell us about your project. We usually reply within 24 hours and set up an intro call the same week.</p>

          <form class="form" id="contact-form" novalidate>
            <div class="two" data-reveal>
              <div class="field">
                <label for="f-name">FULL NAME*</label>
                <input id="f-name" name="name" type="text" autocomplete="name" required>
                <span class="bar"></span>
              </div>
              <div class="field">
                <label for="f-email">EMAIL*</label>
                <input id="f-email" name="email" type="email" autocomplete="email" required>
                <span class="bar"></span>
              </div>
            </div>

            <fieldset class="field" data-reveal>
              <legend>WHAT ARE YOU LOOKING FOR?</legend>
              <div class="chips" style="margin-top:8px">
                <label class="chip"><input type="checkbox" name="service" value="rebranding"><span>REBRANDING</span></label>
                <label class="chip"><input type="checkbox" name="service" value="website"><span>WEBSITE</span></label>
                <label class="chip"><input type="checkbox" name="service" value="campaign"><span>CAMPAIGN</span></label>
                <label class="chip"><input type="checkbox" name="service" value="portfolio"><span>PORTFOLIO</span></label>
                <label class="chip"><input type="checkbox" name="service" value="other"><span>OTHER</span></label>
              </div>
            </fieldset>

            <div class="field" data-reveal>
              <label for="f-msg">TELL US ABOUT YOUR PROJECT</label>
              <textarea id="f-msg" name="message" rows="4"></textarea>
              <span class="bar"></span>
            </div>

            <fieldset class="field" data-reveal>
              <legend>WHAT IS YOUR BUDGET RANGE?</legend>
              <div class="chips" style="margin-top:8px">
                <label class="chip"><input type="radio" name="budget" value="5-10k"><span>$5,000 – $10,000</span></label>
                <label class="chip"><input type="radio" name="budget" value="10-20k"><span>$10,000 – $20,000</span></label>
                <label class="chip"><input type="radio" name="budget" value="20k+"><span>$20,000+</span></label>
              </div>
            </fieldset>

            <div class="field" data-reveal>
              <label for="f-source">HOW DID YOU FIND US?</label>
              <select id="f-source" name="source">
                <option value="">SELECT…</option>
                <option>Referral</option>
                <option>Instagram</option>
                <option>LinkedIn</option>
                <option>Search</option>
                <option>Awards site</option>
                <option>Other</option>
              </select>
              <span class="bar"></span>
            </div>

            <div data-reveal>
              <button class="btn roll" type="submit"><span data-roll="Send Inquiry">Send Inquiry</span><span class="arrow">→</span></button>
            </div>

            <div class="form-ok" role="status">
              <h3>THANK YOU.</h3>
              <p>WE’VE RECEIVED YOUR MESSAGE AND WILL BE IN TOUCH WITHIN 24 HOURS.</p>
            </div>
          </form>
        </div>
      </section>

      <section class="section faq">
        <h2 class="section-title" data-split="lines">QUESTIONS,<br>ANSWERED</h2>
        <div data-faq></div>
      </section>

      <section class="section teaser" id="teaser"></section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
